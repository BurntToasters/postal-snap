[package]
name = "postal-snap"
version = "0.1.6"
description = "A calm, accessible desktop email client."
authors = ["BurntToasters <code@rosie.run>"]
edition = "2021"
license = "UNLICENSED"

[features]
default = ["direct-updater"]
direct-updater = ["dep:tauri-plugin-process", "dep:tauri-plugin-updater"]
flatpak = []
mas = []
msstore = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
keyring = "4.1.5"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-native-tls"] }
mail-parser = "0.11"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "http2"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-native-tls = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# Native window blur / vibrancy (macOS vibrancy, Windows Mica / Acrylic, mirrored from Zinnia)
window-vibrancy = "0.6"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
strip = true
