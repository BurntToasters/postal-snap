[package]
name = "postal-snap"
version = "0.2.5"
description = "A calm, accessible desktop email client."
authors = ["BurntToasters <code@rosie.run>"]
edition = "2021"
license = "MPL-2.0"

[features]
default = ["direct-updater"]
direct-updater = ["dep:tauri-plugin-process", "dep:tauri-plugin-updater"]
flatpak = []
mas = []
msstore = []

[build-dependencies]
serde_json = "1"
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
addr = { version = "0.15", default-features = false, features = ["psl"] }
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
ammonia = "4.1.4"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
imap-proto = "0.16.7"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
keyring = "4.1.5"
keyring-core = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-native-tls"] }
mail-parser = "0.11"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "http2"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tokio-native-tls = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# Native window blur / vibrancy; macOS transparency uses the direct-build
# private API feature, store builds keep it off.
window-vibrancy = "0.6"
zeroize = { version = "1", features = ["derive"] }
quick-xml = { version = "0.42", default-features = false }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["image-png"] }
# Reads NSWorkspace.accessibilityDisplayShouldReduceTransparency; WKWebView does
# not implement the prefers-reduced-transparency media query.
objc2 = "0.6"
# Observes NSApplicationDidBecomeActiveNotification so a notification click
# reopens the window while Postal Snap waits in the menu bar.
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSObject", "NSProcessInfo", "NSString", "NSNotification", "NSOperation", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
proptest = "1"

[lints.rust]
# Win32 Snap Layout integration contains one reviewed, Windows-only adapter.
unsafe_code = "deny"

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
strip = true

# macOS 27 rejects proc-macro dylibs stripped by affected Rust toolchains.
# Build-time artifacts are not shipped, so leave them unstripped.
[profile.release.build-override]
strip = false
