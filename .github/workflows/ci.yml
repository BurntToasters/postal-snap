# Quality gates and unsigned compile checks. Signed Windows NSIS stays on the
# release VM (`npm run release:win` with Azure Artifact Signing).

name: CI

on:
  pull_request:
  push:
    branches: [main, beta]

permissions:
  contents: read

env:
  NODE_VERSION: "24.16.0"
  NPM_VERSION: "12.0.2"
  RUST_VERSION: "1.97.1"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run validate:macos-entitlements
      - run: npm run licenses
      - run: npm run format:check
      - run: npm run format:rust:check
      - run: npm run lint
      - run: npm run lint:rust
      - run: npm run check:native-process-policy
      - run: npm run check:cargo-update-policy
      - run: npm run test:cargo-safe-update
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:release-assets
      - run: npm run test:rust
      - run: npm run test:mail-integration
      - run: npm run build
      - run: npm run audit:npm
      - run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked
      - run: npm run audit:cargo

  macos-entitlements:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/validate-macos-entitlements.js
