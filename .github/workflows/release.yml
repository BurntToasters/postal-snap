name: Release builds

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NPM_VERSION: "12.0.2"
  RUST_VERSION: "1.97.1"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - run: npm run test:mail-integration
      - run: npm run audit
      - run: npm run licenses

  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            command: build:win:x64
            flatpak: ""
            post: ""
          - os: windows-2025
            command: build:win:arm64
            flatpak: ""
            post: ""
          - os: macos-15
            command: build:mac:universal
            flatpak: ""
            post: build:mac:zip
          - os: ubuntu-24.04
            command: build:linux:x64
            flatpak: flatpak:bundle
            post: ""
          - os: ubuntu-24.04-arm
            command: build:linux:arm64
            flatpak: flatpak:bundle:arm64
            post: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - if: runner.os == 'Windows'
        shell: pwsh
        run: npm run setup:win:artifact-signing
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - if: runner.os == 'macOS'
        run: bash scripts/setup-macos-ci-keychain.sh
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      - run: npm run ${{ matrix.command }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - if: matrix.post != ''
        run: npm run ${{ matrix.post }}
      - if: matrix.flatpak != ''
        run: npm run setup:flatpak
      - if: matrix.flatpak != ''
        run: npm run ${{ matrix.flatpak }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postal-snap-${{ matrix.os }}-${{ matrix.command }}
          path: release/

  assemble-draft:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: postal-snap-*
          path: release
          merge-multiple: true
      - name: Import release-signing key
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$GPG_PRIVATE_KEY_BASE64"
          printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
      - run: npm run release:session:start
      - run: npm run release:draft
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run release:sign:gpg
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - run: npm run release:finalize
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run release:verify:local
      - run: npm run release:verify-draft
        env:
          GH_TOKEN: ${{ github.token }}
