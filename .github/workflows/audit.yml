name: Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.16.0"
  NPM_VERSION: "12.0.2"
  RUST_VERSION: "1.97.1"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - run: npm ci --ignore-scripts
      - run: npm run audit:npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked
      - run: npm run audit:cargo
