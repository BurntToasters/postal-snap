# TweetFeed snapshots are published IOCs, not Postal Snap secrets.
# GitHub secret scanning flagged a Telegram bot token that appears as a
# reported URL in the official TweetFeed URL list. Do not scrub that line:
# checksums in sources.json and `npm run tweetfeed:update` would restore it.
paths-ignore:
  - src-tauri/filters/tweetfeed-urls.txt
  - src-tauri/filters/tweetfeed-domains.txt
